<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Debris Detour</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">

  <!-- App Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Full Screen Map Container -->
  <div id="map"></div>

  <!-- White bar across top with title and search box -->
  <div class="top-bar">
    <img class="logo" src="image/CAC%20LOGO%20Image%20Oct%2025,%202026%20at%2009_03_02%20PM.png" alt="Debris Detour logo">
    <input id="search" placeholder="Where to?">
  </div>

  <!-- Address suggestions under the search box -->
  <div id="results"></div>

  <!-- Trip time and distance for the chosen route -->
  <div id="route-card"></div>

  <!-- Big Red Report Button at the bottom center -->
  <button id="report-btn">Report Obstruction</button>

  <button id="settings-btn" aria-label="Settings">⚙</button>

  <!-- Bottom Sheet for Reporting -->
  <div id="sheet" class="sheet"></div>
  <div id="toast"></div>

  <!-- Leaflet JS & Turf.js -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Main Module Script -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
