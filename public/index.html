<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Debris Detour</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- App Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Full Screen Map Container -->
  <div id="map"></div>

  <!-- Gray bar across top with title and search box -->
  <div class="top-bar">
    <div class="brand-title">Debris Detour</div>
    <input id="search" placeholder="Where to?">
  </div>

  <!-- Address suggestions under the search box -->
  <div id="results"></div>

  <!-- Trip time and distance for the chosen route -->
  <div id="route-card"></div>

  <!-- Big Red Report Button at the bottom center -->
  <button id="report-btn">Report Obstruction</button>

  <!-- Bottom Sheet for Reporting -->
  <div id="sheet" class="sheet"></div>
  <div id="toast"></div>

  <!-- Leaflet JS & Turf.js -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Main Module Script -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
